<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fléchettes 501</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #141414;
    --border: #2a2a2a;
    --accent: #e8ff3c;
    --accent2: #ff4c3b;
    --text: #f0f0f0;
    --muted: #555;
    --win: #3cff7a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  /* ══════════ SETUP ══════════ */
  #setup {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; height: 100dvh;
    padding: 2rem 1.5rem;
    gap: 2rem;
    overflow-y: auto;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 18vw, 7rem);
    letter-spacing: 0.04em;
    line-height: 0.9;
    text-align: center;
  }
  .logo span { color: var(--accent); }

  .tagline {
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-align: center;
    margin-top: 0.3rem;
  }

  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 1.25rem;
  }

  .player-row { display: flex; flex-direction: column; gap: 0.4rem; }

  .player-row label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .player-row input {
    background: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .player-row input:focus { border-color: var(--accent); }

  .btn-start {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    padding: 1rem;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn-start:active { transform: scale(0.97); background: #f5ff6b; }

  /* ══════════ GAME LAYOUT ══════════ */
  #game {
    display: none;
    flex-direction: column;
    height: 100%; height: 100dvh;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .round-badge {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .btn-reset {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.4rem 0.7rem;
    cursor: pointer; border-radius: 4px;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-reset:active { border-color: var(--accent2); color: var(--accent2); }

  /* ── Scoreboard (2 colonnes) ── */
  .scoreboard {
    display: grid; grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .player-panel {
    padding: 0.75rem 1rem;
    position: relative;
    transition: background 0.3s;
  }
  .player-panel:first-child { border-right: 1px solid var(--border); }
  .player-panel.active { background: #18180e; }

  .active-indicator {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .player-panel.active .active-indicator { transform: scaleX(1); }

  .player-name {
    font-size: 0.55rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 10vw, 4.5rem);
    line-height: 1;
    transition: color 0.3s;
  }
  .player-panel.active .score-big { color: var(--accent); }
  .score-danger { color: var(--accent2) !important; }

  .stats-row {
    display: flex; gap: 0.8rem;
    margin-top: 0.35rem;
  }
  .stat { display: flex; flex-direction: column; gap: 0.05rem; }
  .stat-label { font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat-value { color: var(--text); font-size: 0.65rem; }

  /* ── History strip ── */
  .history-strip {
    display: flex; gap: 0.3rem;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; overflow-y: hidden;
    align-items: center;
    flex-shrink: 0;
    height: 2.2rem;
  }
  .history-strip::-webkit-scrollbar { display: none; }

  .hist-tag {
    font-size: 0.55rem;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
    opacity: 0; animation: fadeIn 0.3s forwards;
    flex-shrink: 0;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .hist-p1 { background: #1e1e0a; color: var(--accent); border: 1px solid #3a3a10; }
  .hist-p2 { background: #1a0a0a; color: var(--accent2); border: 1px solid #3a1010; }
  .hist-label { font-size: 0.5rem; color: var(--muted); letter-spacing: 0.1em; flex-shrink: 0; }

  /* ── Input area + numpad ── */
  .bottom-area {
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .input-section {
    padding: 0.75rem 1rem 0.5rem;
    flex-shrink: 0;
  }

  .turn-label {
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .turn-label span { color: var(--accent); }

  .score-display-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.4rem;
  }

  /* Grand affichage du score en cours de saisie */
  .score-display {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    text-align: center;
    color: var(--accent);
    min-height: 3.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }
  .score-display.empty { color: var(--border); }
  .score-display.error-border { border-color: var(--accent2); animation: shake 0.3s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .error-msg {
    font-size: 0.6rem;
    color: var(--accent2);
    letter-spacing: 0.08em;
    min-height: 0.9rem;
    margin-bottom: 0.2rem;
  }

  /* ── Numpad ── */
  .numpad {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0.4rem;
    padding: 0 1rem;
    padding-bottom: calc(0.75rem + var(--safe-bottom));
    min-height: 0;
  }

  .np-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s, transform 0.08s;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    overflow: hidden;
  }

  .np-btn:active { transform: scale(0.94); background: #222; border-color: var(--accent); }

  .np-btn.np-zero { grid-column: span 1; }

  .np-btn.np-del {
    color: var(--accent2);
    font-size: 1.2rem;
  }

  .np-btn.np-ok {
    background: var(--accent);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1rem, 4vw, 1.3rem);
    letter-spacing: 0.08em;
    border-color: var(--accent);
  }
  .np-btn.np-ok:active { background: #f5ff6b; transform: scale(0.94); }

  /* ripple */
  .np-btn::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(232,255,60,0.08);
    opacity: 0;
    border-radius: 50%;
    transform: scale(0);
    transition: transform 0.3s, opacity 0.3s;
  }
  .np-btn:active::after { transform: scale(2); opacity: 1; transition: 0s; }

  /* ══════════ WIN OVERLAY ══════════ */
  #win-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.25rem;
    padding: 2rem 1.5rem;
    padding-bottom: calc(2rem + var(--safe-bottom));
  }

  .win-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 16vw, 7rem);
    color: var(--win);
    letter-spacing: 0.06em;
    text-align: center;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    line-height: 1;
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .win-subtitle {
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: center;
  }

  .win-stats {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    border-radius: 8px;
    display: flex; gap: 2rem;
    font-size: 0.75rem;
    width: 100%; max-width: 340px;
    justify-content: center;
  }
  .win-stat { display: flex; flex-direction: column; gap: 0.3rem; text-align: center; }
  .win-stat-label { font-size: 0.5rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .win-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--win); }

  .win-btns { display: flex; flex-direction: column; gap: 0.7rem; width: 100%; max-width: 340px; }

  .btn-rematch {
    background: var(--win); color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; letter-spacing: 0.1em;
    padding: 0.9rem; cursor: pointer; border-radius: 6px;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn-rematch:active { transform: scale(0.97); }

  .btn-new-players {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 0.7rem; cursor: pointer; border-radius: 6px;
    transition: border-color 0.2s, color 0.2s;
    width: 100%;
  }
  .btn-new-players:active { border-color: var(--text); color: var(--text); }
</style>
</head>
<body>

<!-- ══════════ SETUP ══════════ -->
<div id="setup">
  <div>
    <div class="logo">FLÉCH<span>ETTES</span></div>
    <div class="tagline">501 · Règles classiques</div>
  </div>

  <div class="setup-card">
    <div class="player-row">
      <label>Joueur 1</label>
      <input id="name1" type="text" placeholder="Nom joueur 1" maxlength="14" autocomplete="off" autocorrect="off">
    </div>
    <div class="player-row">
      <label>Joueur 2</label>
      <input id="name2" type="text" placeholder="Nom joueur 2" maxlength="14" autocomplete="off" autocorrect="off">
    </div>
    <button class="btn-start" onclick="startGame()">LANCER LA PARTIE</button>
  </div>
</div>

<!-- ══════════ GAME ══════════ -->
<div id="game">

  <div class="topbar">
    <div class="topbar-logo">501</div>
    <div class="round-badge" id="round-label">MANCHE 1</div>
    <button class="btn-reset" onclick="resetToSetup()">↩ NOUVEAU</button>
  </div>

  <div class="scoreboard">
    <div class="player-panel active" id="panel1">
      <div class="active-indicator"></div>
      <div class="player-name" id="pname1">—</div>
      <div class="score-big" id="pscore1">501</div>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Moy</span>
          <span class="stat-value" id="pmoy1">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Volées</span>
          <span class="stat-value" id="pvolees1">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="pbest1">—</span>
        </div>
      </div>
    </div>
    <div class="player-panel" id="panel2">
      <div class="active-indicator"></div>
      <div class="player-name" id="pname2">—</div>
      <div class="score-big" id="pscore2">501</div>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Moy</span>
          <span class="stat-value" id="pmoy2">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Volées</span>
          <span class="stat-value" id="pvolees2">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="pbest2">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="history-strip" id="history">
    <span class="hist-label">HISTORIQUE —</span>
  </div>

  <div class="bottom-area">
    <div class="input-section">
      <div class="turn-label">Tour de <span id="turn-name">—</span></div>
      <div class="score-display-row">
        <div class="score-display empty" id="scoreDisplay">0</div>
      </div>
      <div class="error-msg" id="errMsg"></div>
    </div>

    <!-- Numpad physique -->
    <div class="numpad" id="numpad">
      <button class="np-btn" onclick="padPress('1')">1</button>
      <button class="np-btn" onclick="padPress('2')">2</button>
      <button class="np-btn" onclick="padPress('3')">3</button>
      <button class="np-btn" onclick="padPress('4')">4</button>
      <button class="np-btn" onclick="padPress('5')">5</button>
      <button class="np-btn" onclick="padPress('6')">6</button>
      <button class="np-btn" onclick="padPress('7')">7</button>
      <button class="np-btn" onclick="padPress('8')">8</button>
      <button class="np-btn" onclick="padPress('9')">9</button>
      <button class="np-btn np-zero" onclick="padPress('0')">0</button>
      <button class="np-btn np-del" onclick="padDel()">⌫</button>
      <button class="np-btn np-ok" onclick="submitScore()">OK ✓</button>
    </div>
  </div>
</div>

<!-- ══════════ WIN ══════════ -->
<div id="win-overlay">
  <div class="win-title" id="win-title">VICTOIRE</div>
  <div class="win-subtitle" id="win-subtitle">a remporté la partie !</div>
  <div class="win-stats">
    <div class="win-stat">
      <span class="win-stat-label">Moyenne</span>
      <span class="win-stat-val" id="win-moy">—</span>
    </div>
    <div class="win-stat">
      <span class="win-stat-label">Volées</span>
      <span class="win-stat-val" id="win-volees">—</span>
    </div>
    <div class="win-stat">
      <span class="win-stat-label">Meilleur</span>
      <span class="win-stat-val" id="win-best">—</span>
    </div>
  </div>
  <div class="win-btns">
    <button class="btn-rematch" onclick="rematch()">↺ REVANCHE</button>
    <button class="btn-new-players" onclick="resetToSetup()">Changer de joueurs</button>
  </div>
</div>

<script>
  let state = {};
  let currentInput = '';

  function initState(n1, n2) {
    state = {
      names: [n1, n2],
      points: [501, 501],
      totals: [0, 0],
      volees: [0, 0],
      bests: [0, 0],
      turn: 0,
      round: 1,
    };
    currentInput = '';
  }

  // ─── NUMPAD ───────────────────────────────────────────
  function padPress(digit) {
    if (currentInput.length >= 3) return; // max 3 chiffres (180)
    currentInput += digit;
    updateDisplay();
    clearError();
  }

  function padDel() {
    currentInput = currentInput.slice(0, -1);
    updateDisplay();
    clearError();
  }

  function updateDisplay() {
    const el = document.getElementById('scoreDisplay');
    if (currentInput === '' || currentInput === '0') {
      el.textContent = '0';
      el.classList.add('empty');
    } else {
      el.textContent = currentInput;
      el.classList.remove('empty');
    }
  }

  // ─── SUBMIT ───────────────────────────────────────────
  function submitScore() {
    const val = parseInt(currentInput) || 0;
    const disp = document.getElementById('scoreDisplay');

    if (val > 180) {
      showError('Score maximum : 180 !');
      disp.classList.remove('error-border'); void disp.offsetWidth; disp.classList.add('error-border');
      setTimeout(() => disp.classList.remove('error-border'), 400);
      return;
    }

    const t = state.turn;
    const newPts = state.points[t] - val;

    if (newPts < 0) {
      showError('Trop élevé — vous dépasseriez 0 !');
      disp.classList.remove('error-border'); void disp.offsetWidth; disp.classList.add('error-border');
      setTimeout(() => disp.classList.remove('error-border'), 400);
      return;
    }

    clearError();

    state.totals[t] += val;
    state.volees[t]++;
    if (val > state.bests[t]) state.bests[t] = val;
    state.points[t] = newPts;

    addHistory(t, val);
    currentInput = '';
    updateDisplay();

    if (newPts === 0) {
      renderAll();
      setTimeout(() => showWin(t), 300);
      return;
    }

    if (t === 1) state.round++;
    state.turn = t === 0 ? 1 : 0;
    renderAll();
  }

  // ─── RENDER ───────────────────────────────────────────
  function renderAll() {
    for (let i = 0; i < 2; i++) {
      document.getElementById(`pname${i+1}`).textContent = state.names[i];
      const scoreEl = document.getElementById(`pscore${i+1}`);
      scoreEl.textContent = state.points[i];
      scoreEl.classList.toggle('score-danger', state.points[i] <= 50 && state.points[i] > 0);

      const moy = state.volees[i] > 0
        ? (state.totals[i] / state.volees[i]).toFixed(1)
        : '—';
      document.getElementById(`pmoy${i+1}`).textContent = moy;
      document.getElementById(`pvolees${i+1}`).textContent = state.volees[i];
      document.getElementById(`pbest${i+1}`).textContent = state.bests[i] || '—';

      document.getElementById(`panel${i+1}`).classList.toggle('active', state.turn === i);
    }
    document.getElementById('turn-name').textContent = state.names[state.turn];
    document.getElementById('round-label').textContent = `MANCHE ${state.round}`;
  }

  // ─── HISTORY ─────────────────────────────────────────
  function addHistory(playerIdx, score) {
    const strip = document.getElementById('history');
    const tag = document.createElement('span');
    tag.className = `hist-tag hist-p${playerIdx + 1}`;
    tag.textContent = `${state.names[playerIdx]}: ${score}`;
    strip.appendChild(tag);
    strip.scrollLeft = strip.scrollWidth;
  }

  // ─── ERRORS ──────────────────────────────────────────
  function showError(msg) { document.getElementById('errMsg').textContent = msg; }
  function clearError() { document.getElementById('errMsg').textContent = ''; }

  // ─── WIN ──────────────────────────────────────────────
  function showWin(winnerIdx) {
    const n = state.names[winnerIdx];
    const moy = (state.totals[winnerIdx] / state.volees[winnerIdx]).toFixed(1);
    document.getElementById('win-title').textContent = n.toUpperCase();
    document.getElementById('win-subtitle').textContent = 'a remporté la partie !';
    document.getElementById('win-moy').textContent = moy;
    document.getElementById('win-volees').textContent = state.volees[winnerIdx];
    document.getElementById('win-best').textContent = state.bests[winnerIdx];
    document.getElementById('win-overlay').style.display = 'flex';
  }

  function rematch() {
    document.getElementById('win-overlay').style.display = 'none';
    document.getElementById('history').innerHTML = '<span class="hist-label">HISTORIQUE —</span>';
    initState(state.names[0], state.names[1]);
    renderAll();
    updateDisplay();
    clearError();
  }

  function resetToSetup() {
    document.getElementById('win-overlay').style.display = 'none';
    document.getElementById('game').style.display = 'none';
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('history').innerHTML = '<span class="hist-label">HISTORIQUE —</span>';
    document.getElementById('name1').value = '';
    document.getElementById('name2').value = '';
    currentInput = '';
    clearError();
  }

  function startGame() {
    const n1 = document.getElementById('name1').value.trim() || 'Joueur 1';
    const n2 = document.getElementById('name2').value.trim() || 'Joueur 2';
    initState(n1, n2);
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    renderAll();
    updateDisplay();
  }

  // Enter sur le setup
  ['name1','name2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') startGame();
    });
  });

  // Clavier physique (desktop)
  document.addEventListener('keydown', e => {
    if (document.getElementById('game').style.display !== 'flex') return;
    if (e.key >= '0' && e.key <= '9') padPress(e.key);
    else if (e.key === 'Backspace') padDel();
    else if (e.key === 'Enter') submitScore();
  });
</script>
</body>
</html>
