<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fléchettes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #141414;
    --border: #2a2a2a;
    --accent: #e8ff3c;
    --accent2: #ff4c3b;
    --text: #f0f0f0;
    --muted: #555;
    --win: #3cff7a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  /* ══════════ SETUP ══════════ */
  #setup {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; height: 100dvh;
    padding: 2rem 1.5rem;
    gap: 2rem;
    overflow-y: auto;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 18vw, 7rem);
    letter-spacing: 0.04em;
    line-height: 0.9;
    text-align: center;
  }
  .logo span { color: var(--accent); }

  .tagline {
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-align: center;
    margin-top: 0.3rem;
  }

  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 1.25rem;
  }

  .player-row { display: flex; flex-direction: column; gap: 0.4rem; }

  .player-row label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .player-row input {
    background: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .player-row input:focus { border-color: var(--accent); }

  .btn-start {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    padding: 1rem;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn-start:active { transform: scale(0.97); background: #f5ff6b; }

  /* ══════════ GAME LAYOUT ══════════ */
  #game {
    display: none;
    flex-direction: column;
    height: 100%; height: 100dvh;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .round-badge {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .btn-reset {
    background: none; border: 1px solid rgb(129, 5, 5);
    color: rgb(129, 5, 5); font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.4rem 0.7rem;
    cursor: pointer; border-radius: 4px;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-reset:active { border-color: var(--accent2); color: var(--accent2); }

  /* ── Scoreboard (2 colonnes) ── */
  .scoreboard {
    display: grid; grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .player-panel {
    padding: 0.75rem 1rem;
    position: relative;
    transition: background 0.3s;
  }
  .player-panel:first-child { border-right: 1px solid var(--border); }
  .player-panel.active { background: #18180e; }

  .active-indicator {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .player-panel.active .active-indicator { transform: scaleX(1); }

  .player-name {
    font-size: 0.55rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 10vw, 4.5rem);
    line-height: 1;
    transition: color 0.3s;
  }
  .player-panel.active .score-big { color: var(--accent); }
  .score-danger { color: var(--accent2) !important; }

  .stats-row {
    display: flex; gap: 0.8rem;
    margin-top: 0.35rem;
  }
  .stat { display: flex; flex-direction: column; gap: 0.05rem; }
  .stat-label { font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat-value { color: var(--text); font-size: 0.65rem; }

  /* ── History strip ── */
  .history-strip {
    display: flex; gap: 0.3rem;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; overflow-y: hidden;
    align-items: center;
    flex-shrink: 0;
    height: 2.2rem;
  }
  .history-strip::-webkit-scrollbar { display: none; }

  .hist-tag {
    font-size: 0.55rem;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
    opacity: 0; animation: fadeIn 0.3s forwards;
    flex-shrink: 0;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .hist-p1 { background: #1e1e0a; color: var(--accent); border: 1px solid #3a3a10; }
  .hist-p2 { background: #1a0a0a; color: var(--accent2); border: 1px solid #3a1010; }
  .hist-label { font-size: 0.5rem; color: var(--muted); letter-spacing: 0.1em; flex-shrink: 0; }

  /* ── Input area + numpad ── */
  .bottom-area {
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .input-section {
    padding: 0.75rem 1rem 0.5rem;
    flex-shrink: 0;
  }

  .turn-label {
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .turn-label span { color: var(--accent); }

  .score-display-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.4rem;
  }

  /* Grand affichage du score en cours de saisie */
  .score-display {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    text-align: center;
    color: var(--accent);
    min-height: 3.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }
  .score-display.empty { color: var(--border); }
  .score-display.error-border { border-color: var(--accent2); animation: shake 0.3s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .error-msg {
    font-size: 0.6rem;
    color: var(--accent2);
    letter-spacing: 0.08em;
    min-height: 0.9rem;
    margin-bottom: 0.2rem;
  }

  /* ── Numpad ── */
  .numpad {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0.4rem;
    padding: 0 1rem;
    padding-bottom: calc(0.75rem + var(--safe-bottom));
    min-height: 0;
  }

  .np-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s, transform 0.08s;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    overflow: hidden;
  }

  .np-btn:active { transform: scale(0.94); background: #222; border-color: var(--accent); }

  .np-btn.np-zero { grid-column: span 1; }

  .np-btn.np-del {
    color: var(--accent2);
    font-size: 1.2rem;
  }

  .np-btn.np-ok {
    background: var(--accent);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1rem, 4vw, 1.3rem);
    letter-spacing: 0.08em;
    border-color: var(--accent);
  }
  .np-btn.np-ok:active { background: #f5ff6b; transform: scale(0.94); }

  /* ripple */
  .np-btn::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(232,255,60,0.08);
    opacity: 0;
    border-radius: 50%;
    transform: scale(0);
    transition: transform 0.3s, opacity 0.3s;
  }
  .np-btn:active::after { transform: scale(2); opacity: 1; transition: 0s; }

  .btn-undo {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.4rem 0.7rem;
    cursor: pointer; border-radius: 4px;
    margin-right: 5px;
    transition: all 0.2s;
  }
  .btn-undo:active { border-color: var(--accent); color: var(--accent); }
  .btn-undo:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ══════════ WIN OVERLAY ══════════ */
  #win-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.25rem;
    padding: 2rem 1.5rem;
    padding-bottom: calc(2rem + var(--safe-bottom));
  }

  .win-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 16vw, 7rem);
    color: var(--win);
    letter-spacing: 0.06em;
    text-align: center;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    line-height: 1;
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .win-subtitle {
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: center;
  }

  .win-stats {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    border-radius: 8px;
    display: flex; gap: 2rem;
    font-size: 0.75rem;
    width: 100%; max-width: 340px;
    justify-content: center;
  }
  .win-stat { display: flex; flex-direction: column; gap: 0.3rem; text-align: center; }
  .win-stat-label { font-size: 0.5rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .win-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--win); }

  .win-btns { display: flex; flex-direction: column; gap: 0.7rem; width: 100%; max-width: 340px; }

  .btn-rematch {
    background: var(--win); color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; letter-spacing: 0.1em;
    padding: 0.9rem; cursor: pointer; border-radius: 6px;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn-rematch:active { transform: scale(0.97); }

  .btn-new-players {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 0.7rem; cursor: pointer; border-radius: 6px;
    transition: border-color 0.2s, color 0.2s;
    width: 100%;
  }
  .btn-new-players:active { border-color: var(--text); color: var(--text); }

  /* Bouton Suggestion Finish */
  .finish-hint-btn {
    display: inline-block;
    margin-left: 10px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.8rem;
    padding: 2px 8px;
    cursor: pointer;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Modal Finish */
  #finish-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center; justify-content: center;
    padding: 2rem;
  }

  .finish-card {
    background: var(--panel);
    border: 1px solid var(--accent);
    padding: 1.5rem;
    border-radius: 8px;
    width: 100%; max-width: 300px;
    text-align: center;
  }

  .finish-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .finish-path {
    font-family: 'DM Mono', monospace;
    font-size: 1.2rem;
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
  }

  .btn-close-finish {
    background: var(--border);
    color: var(--text);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-size: 0.7rem;
    text-transform: uppercase;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- ══════════ SETUP ══════════ -->
<div id="setup">
  <div>
    <div class="logo">FLÉCH<span>ETTES</span></div>
    <div class="tagline">501 · Règles classiques</div>
  </div>

  <div class="setup-card">
    <div class="player-row">
      <label>Joueur 1</label>
      <input id="name1" type="text" placeholder="Nom joueur 1" maxlength="14" autocomplete="off" autocorrect="off">
    </div>
    <div class="player-row">
      <label>Joueur 2</label>
      <input id="name2" type="text" placeholder="Nom joueur 2" maxlength="14" autocomplete="off" autocorrect="off">
    </div>
    <button class="btn-start" onclick="startGame()">LANCER LA PARTIE</button>
  </div>
</div>

<!-- ══════════ GAME ══════════ -->
<div id="game">

  <div class="topbar">
    <div class="topbar-logo">DARTS</div>
    <div class="round-badge" id="round-label">MANCHE 1</div>
    <div>
      <button class="btn-undo" id="undo-btn" onclick="undoLastMove()" disabled>⟲ ANNULER</button>
      <button class="btn-reset" onclick="resetToSetup()">↩ NOUVEAU</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="player-panel active" id="panel1">
      <div class="active-indicator"></div>
      <div class="player-name" id="pname1">—</div>
      <div class="score-big" id="pscore1">501</div>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Moy</span>
          <span class="stat-value" id="pmoy1">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Volées</span>
          <span class="stat-value" id="pvolees1">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="pbest1">—</span>
        </div>
      </div>
    </div>
    <div class="player-panel" id="panel2">
      <div class="active-indicator"></div>
      <div class="player-name" id="pname2">—</div>
      <div class="score-big" id="pscore2">501</div>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Moy</span>
          <span class="stat-value" id="pmoy2">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Volées</span>
          <span class="stat-value" id="pvolees2">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="pbest2">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="history-strip" id="history">
    <span class="hist-label">HISTORIQUE —</span>
  </div>

  <div class="bottom-area">
    <div class="input-section">
      <div class="turn-label">Tour de <span id="turn-name">—</span></div>
      <div class="score-display-row">
        <div class="score-display empty" id="scoreDisplay">0</div>
      </div>
      <div class="error-msg" id="errMsg"></div>
    </div>

    <!-- Numpad physique -->
    <div class="numpad" id="numpad">
      <button class="np-btn" onclick="padPress('1')">1</button>
      <button class="np-btn" onclick="padPress('2')">2</button>
      <button class="np-btn" onclick="padPress('3')">3</button>
      <button class="np-btn" onclick="padPress('4')">4</button>
      <button class="np-btn" onclick="padPress('5')">5</button>
      <button class="np-btn" onclick="padPress('6')">6</button>
      <button class="np-btn" onclick="padPress('7')">7</button>
      <button class="np-btn" onclick="padPress('8')">8</button>
      <button class="np-btn" onclick="padPress('9')">9</button>
      <button class="np-btn np-zero" onclick="padPress('0')">0</button>
      <button class="np-btn np-del" onclick="padDel()">⌫</button>
      <button class="np-btn np-ok" onclick="submitScore()">OK ✓</button>
    </div>
  </div>
</div>

<!-- ══════════ WIN ══════════ -->
<div id="win-overlay">
  <div class="win-title" id="win-title">VICTOIRE</div>
  <div class="win-subtitle" id="win-subtitle">a remporté la partie !</div>
  <div class="win-stats">
    <div class="win-stat">
      <span class="win-stat-label">Moyenne</span>
      <span class="win-stat-val" id="win-moy">—</span>
    </div>
    <div class="win-stat">
      <span class="win-stat-label">Volées</span>
      <span class="win-stat-val" id="win-volees">—</span>
    </div>
    <div class="win-stat">
      <span class="win-stat-label">Meilleur</span>
      <span class="win-stat-val" id="win-best">—</span>
    </div>
  </div>
  <div class="win-btns">
    <button class="btn-rematch" onclick="rematch()">↺ REVANCHE</button>
    <button class="btn-new-players" onclick="resetToSetup()">Changer de joueurs</button>
  </div>
</div><div id="finish-modal" onclick="this.style.display='none'">
  <div class="finish-card" onclick="event.stopPropagation()">
    <h3 id="finish-score-title">FINISH 170</h3>
    <div class="finish-path" id="finish-path-val">T20 - T20 - BULL</div>
    <button class="btn-close-finish" onclick="document.getElementById('finish-modal').style.display='none'">FERMER</button>
  </div>
</div>

<script>
let state = {};
  let currentInput = '';
  let historyState = null; 
  
  function undoLastMove() {
    if (!historyState) return;
    
    // On restaure l'état
    state = JSON.parse(JSON.stringify(historyState));
    historyState = null; // On ne peut annuler qu'une seule fois
    
    // On retire le dernier tag de l'historique visuel
    const strip = document.getElementById('history');
    if (strip.lastChild && strip.lastChild.className !== 'hist-label') {
      strip.removeChild(strip.lastChild);
    }
    
    document.getElementById('undo-btn').disabled = true;
    renderAll();
    clearError();
  }

  // Table des finitions standards (Checkouts)
  const CHECKOUTS = {
    170: ["T20 T20 BULL"], 167: ["T20 T19 BULL"], 164: ["T20 T18 BULL"], 161: ["T20 T17 BULL"],
    160: ["T20 T20 D20"], 158: ["T20 T20 D19"], 157: ["T20 T19 D20"], 156: ["T20 T20 D18"],
    155: ["T20 T19 D19"], 154: ["T20 T18 D20"], 153: ["T20 T19 D18"], 152: ["T20 T17 D20"],
    151: ["T20 T17 D19"], 150: ["T20 T18 D18", "BULL BULL BULL"], 149: ["T20 T19 D16"],
    148: ["T20 T16 D20"], 147: ["T20 T17 D18"], 146: ["T20 T18 D16"], 145: ["T20 T15 D20"],
    144: ["T20 T20 D12"], 143: ["T20 T17 D16"], 142: ["T20 T14 D20"], 141: ["T20 T15 D18", "T20 T19 D12"],
    140: ["T20 T16 D16", "T20 T20 D10"], 139: ["T19 T14 D20"], 138: ["T20 T18 D12"], 137: ["T19 T20 D10"],
    136: ["T20 T20 D8"], 135: ["T20 T15 D15", "25 T20 D25"], 134: ["T20 T14 D16"], 133: ["T20 T19 D8"],

  function getCheckout(score) {
    if (score > 170 || score < 2) return null;
    
    // Si le score est dans la liste, on renvoie le tableau des chemins
    if (CHECKOUTS[score]) return CHECKOUTS[score];
    
    return ["Pas de finish direct"];
  }

  function showFinish(score) {
    const paths = getCheckout(score);
    const container = document.getElementById('finish-path-val');
    
    document.getElementById('finish-score-title').textContent = "FINISH " + score;
    
    if (paths && paths.length > 0) {
      // On affiche chaque possibilité avec un petit style sympa
      container.innerHTML = paths.map(p => 
        `<div style="padding: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; border-left: 3px solid var(--accent);">
          ${p}
        </div>`
      ).join('');
    } else {
      container.innerHTML = "Aucun finish possible cette volée.";
    }
    
    document.getElementById('finish-modal').style.display = 'flex';
  }

  function initState(n1, n2) {
    state = {
      names: [n1, n2],
      points: [501, 501],
      totals: [0, 0],
      volees: [0, 0],
      bests: [0, 0],
      turn: 0,
      round: 1,
    };
    currentInput = '';
  }

  function padPress(digit) {
    if (currentInput.length >= 3) return;
    currentInput += digit;
    updateDisplay();
    clearError();
  }

  function padDel() {
    currentInput = currentInput.slice(0, -1);
    updateDisplay();
    clearError();
  }

  function updateDisplay() {
    const el = document.getElementById('scoreDisplay');
    if (currentInput === '' || currentInput === '0') {
      el.textContent = '0';
      el.classList.add('empty');
    } else {
      el.textContent = currentInput;
      el.classList.remove('empty');
    }
  }

  function submitScore() {
    const val = parseInt(currentInput) || 0;
    const disp = document.getElementById('scoreDisplay');

    // 1. Vérification du score maximum
    if (val > 180) {
      showError('Score maximum : 180 !');
      disp.classList.add('error-border');
      setTimeout(() => disp.classList.remove('error-border'), 400);
      return;
    }

    const t = state.turn;
    const newPts = state.points[t] - val;

    // 2. Vérification du score impossible (Bust)
    if (newPts < 0 || newPts === 1) {
      showError('Score impossible (reste 1 ou < 0)');
      disp.classList.add('error-border');
      setTimeout(() => disp.classList.remove('error-border'), 400);
      return;
    }

    // 3. Sauvegarde pour annulation (Undo)
    historyState = JSON.parse(JSON.stringify(state));
    document.getElementById('undo-btn').disabled = false;

    // 4. Mise à jour des scores
    clearError();
    state.totals[t] += val;
    state.volees[t]++;
    if (val > state.bests[t]) state.bests[t] = val;
    state.points[t] = newPts;

    addHistory(t, val);
    currentInput = '';
    updateDisplay();

    // 5. Vérification de la victoire
    if (newPts === 0) {
      renderAll();
      setTimeout(() => showWin(t), 300);
      return;
    }

    // 6. Changement de tour
    if (t === 1) state.round++;
    state.turn = t === 0 ? 1 : 0;
    renderAll();
  }

  function renderAll() {
    for (let i = 0; i < 2; i++) {
      document.getElementById(`pname${i+1}`).textContent = state.names[i];
      const scoreEl = document.getElementById(`pscore${i+1}`);
      const s = state.points[i];
      
      // On affiche le score + le bouton finish si applicable
      scoreEl.innerHTML = s + (s <= 170 && s > 1 ? ` <button class="finish-hint-btn" onclick="showFinish(${s})">FINISH ?</button>` : '');
      
      scoreEl.classList.toggle('score-danger', s <= 170 && s > 0);

      const moy = state.volees[i] > 0 ? (state.totals[i] / state.volees[i]).toFixed(1) : '—';
      document.getElementById(`pmoy${i+1}`).textContent = moy;
      document.getElementById(`pvolees${i+1}`).textContent = state.volees[i];
      document.getElementById(`pbest${i+1}`).textContent = state.bests[i] || '—';
      document.getElementById(`panel${i+1}`).classList.toggle('active', state.turn === i);
    }
    document.getElementById('turn-name').textContent = state.names[state.turn];
    document.getElementById('round-label').textContent = `MANCHE ${state.round}`;
  }

  function addHistory(playerIdx, score) {
    const strip = document.getElementById('history');
    const tag = document.createElement('span');
    tag.className = `hist-tag hist-p${playerIdx + 1}`;
    tag.textContent = `${state.names[playerIdx]}: ${score}`;
    strip.appendChild(tag);
    strip.scrollLeft = strip.scrollWidth;
  }

  function showError(msg) { document.getElementById('errMsg').textContent = msg; }
  function clearError() { document.getElementById('errMsg').textContent = ''; }

  function showWin(winnerIdx) {
    const n = state.names[winnerIdx];
    const moy = (state.totals[winnerIdx] / state.volees[winnerIdx]).toFixed(1);
    document.getElementById('win-title').textContent = n.toUpperCase();
    document.getElementById('win-subtitle').textContent = 'a remporté la partie !';
    document.getElementById('win-moy').textContent = moy;
    document.getElementById('win-volees').textContent = state.volees[winnerIdx];
    document.getElementById('win-best').textContent = state.bests[winnerIdx];
    document.getElementById('win-overlay').style.display = 'flex';
  }

  function rematch() {
    document.getElementById('win-overlay').style.display = 'none';
    document.getElementById('history').innerHTML = '<span class="hist-label">HISTORIQUE —</span>';
    initState(state.names[0], state.names[1]);
    renderAll();
    updateDisplay();
    document.getElementById('undo-btn').disabled = true;
    historyState = null;
  }

  function resetToSetup() {
    document.getElementById('win-overlay').style.display = 'none';
    document.getElementById('game').style.display = 'none';
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('history').innerHTML = '<span class="hist-label">HISTORIQUE —</span>';
    document.getElementById('name1').value = '';
    document.getElementById('name2').value = '';
    document.getElementById('undo-btn').disabled = true;
    historyState = null;
  }

  function startGame() {
    const n1 = document.getElementById('name1').value.trim() || 'Joueur 1';
    const n2 = document.getElementById('name2').value.trim() || 'Joueur 2';
    initState(n1, n2);
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    renderAll();
    updateDisplay();
  }

  ['name1','name2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  });

  document.addEventListener('keydown', e => {
    if (document.getElementById('game').style.display !== 'flex') return;
    if (e.key >= '0' && e.key <= '9') padPress(e.key);
    else if (e.key === 'Backspace') padDel();
    else if (e.key === 'Enter') submitScore();
  });
</script>
